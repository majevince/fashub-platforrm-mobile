# Load-balances the two Metro dev-server containers (mobile-1, mobile-2)
# behind one endpoint. ip_hash gives session affinity: Metro's dev server
# is stateful per client (in-memory transform cache, filesystem watcher,
# and an HMR websocket) — without stickiness, a client's follow-up requests
# could land on the OTHER container mid-session, which either one hasn't
# warmed its cache for or (worse) has no matching HMR socket for, breaking
# Fast Refresh. This is a real limitation of load-balancing a single-writer
# dev tool rather than a stateless API — flagged, not hidden.
upstream mobile_metro {
    ip_hash;
    server mobile-1:8081;
    server mobile-2:8081;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://mobile_metro;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Metro's Fast Refresh / dev-server messaging rides a WebSocket —
        # required for the proxy to pass it through instead of terminating it.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A cold-cache bundle compile took ~15-20s for this app when
        # measured directly against Metro — default proxy timeouts would
        # cut that off mid-compile.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Metro always embeds its OWN internal listening port (8081) in the
        # manifest's absolute asset/bundle URLs (e.g.
        # "http://mobile.fas-hub.com:8081/...bundle"), regardless of what
        # port the client actually reached it on — it has no way to know
        # it's sitting behind a proxy on a different external port. Since
        # port 8081 is never exposed publicly (only this nginx's port 80,
        # proxied through Cloudflare, is), a client like Expo Go can fetch
        # the manifest fine but then fails to load — its bundle request
        # goes to an unroutable host:port. Stripping ":8081" from the
        # response body is the fix: the client then requests the bundle
        # from the same host:port it already successfully reached.
        proxy_set_header Accept-Encoding "";
        sub_filter_types application/expo+json application/json;
        sub_filter_once off;
        sub_filter ':8081' '';

        # sub_filter only ever sees one buffered chunk of the upstream
        # response at a time — if the target string straddles a buffer
        # boundary, it's silently missed. The manifest response is only a
        # few KB, so a single buffer this size guarantees the whole thing
        # (and therefore every occurrence of ":8081") is scanned in one
        # pass rather than split across reads.
        proxy_buffering on;
        proxy_buffer_size 64k;
        proxy_buffers 4 64k;
    }
}
